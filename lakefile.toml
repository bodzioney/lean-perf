name = "leanperf"
version = "0.1.0"
defaultTargets = ["leanperf"]
testDriver = "tests"

[[lean_exe]]
name = "leanperf"
root = "LeanPerf.Main"
supportInterpreter = true

[[lean_lib]]
name = "LeanPerf"
roots = ["LeanPerf"]
globs = ["LeanPerf.+"]

[[lean_exe]]
name = "tests"
root = "Tests"
srcDir = "tests"
